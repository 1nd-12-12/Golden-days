<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | 𝑮𝒐𝒍𝒅𝒆𝒏 𝑫𝒂𝒚𝒔 ᥫ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
      position: relative;
      z-index: 5;
    }
    .admin-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--gold-border);
      margin-bottom: 2rem;
    }
    .storage-notice {
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid var(--gold-border-bright);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.25rem;
      font-size: 0.9rem;
      color: #e8dec8;
    }
    .storage-notice strong {
      color: var(--gold-light);
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 2rem;
      align-items: start;
    }
    @media (max-width: 900px) {
      .admin-grid { grid-template-columns: 1fr; }
    }
    .admin-card {
      border-radius: 20px;
      padding: 1.85rem;
    }
    .admin-card h2 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--gold-light);
      margin-bottom: 1.25rem;
    }
    .form-group {
      margin-bottom: 1.15rem;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
      text-transform: uppercase;
    }
    .form-control {
      width: 100%;
      padding: 0.78rem 1rem;
      border-radius: 10px;
      background: rgba(8, 8, 10, 0.85);
      border: 1px solid var(--gold-border);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.94rem;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--gold-light);
    }
    textarea.form-control {
      min-height: 105px;
      resize: vertical;
    }
    .dp-preview-box {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.65rem;
    }
    .dp-preview-box img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold-primary);
    }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }
    .btn-sm {
      padding: 0.65rem 1.1rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--gold-border);
      background: rgba(255,255,255,0.04);
      color: var(--text-main);
      transition: var(--transition-fast);
      text-decoration: none;
    }
    .btn-sm:hover {
      border-color: var(--gold-light);
      color: var(--gold-light);
    }
    .btn-danger {
      border-color: rgba(220, 75, 75, 0.45);
      color: #ff8c8c;
    }
    .btn-danger:hover {
      background: rgba(220, 75, 75, 0.16);
      border-color: #ff8c8c;
    }
    .member-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--gold-border);
      margin-bottom: 0.85rem;
    }
    .member-item-left {
      display: flex;
      align-items: center;
      gap: 0.95rem;
      min-width: 0;
    }
    .member-item-left img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--gold-primary);
      flex-shrink: 0;
    }
    .member-item-meta {
      min-width: 0;
    }
    .member-item-meta h4 {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .member-item-meta span {
      font-size: 0.82rem;
      color: var(--gold-light);
    }
    .member-item-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }
    .order-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--gold-border);
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold-light);
      cursor: pointer;
    }
    .order-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-topbar">
      <div>
        <span class="section-kicker">CONTROL PANEL</span>
        <h1 class="section-title" style="font-size: 1.9rem;">𝑮𝒐𝒍𝒅𝒆𝒏 𝑫𝒂𝒚𝒔 ᥫ — Member Manager</h1>
      </div>
      <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
        <button id="resetDefaultBtn" class="btn-sm btn-danger">🔄 Force Reset to New 14 Members</button>
        <a href="index.html" class="btn-gold-primary">← Back to Showcase</a>
      </div>
    </div>

    <div class="storage-notice">
      <strong>Important Note:</strong> Agar aapko naye 14 members aur Aryan + Tanya turant dekhne hain, toh upar diye gaye <strong>"Force Reset to New 14 Members"</strong> button par click kar dein!
    </div>

    <div class="admin-grid">
      <div class="admin-card glass-panel">
        <h2 id="formTitle">Add New Member</h2>
        <form id="memberForm">
          <input type="hidden" id="editMemberId" value="" />

          <div class="form-group">
            <label for="memberName">Display Name *</label>
            <input type="text" id="memberName" class="form-control" placeholder="e.g. Aryan" required />
          </div>

          <div class="form-group">
            <label for="memberUsername">Instagram Username *</label>
            <input type="text" id="memberUsername" class="form-control" placeholder="e.g. 1nd_mp48 (without @)" required />
          </div>

          <div class="form-group">
            <label for="memberAvatarPath">Profile Picture Filename</label>
            <input type="text" id="memberAvatarPath" class="form-control" placeholder="member-01.jpg" />
          </div>

          <div class="form-group">
            <label for="memberBio">Personalised Introduction (Hindi) *</label>
            <textarea id="memberBio" class="form-control" placeholder="Write introduction..." required></textarea>
          </div>

          <div class="btn-row">
            <button type="submit" class="btn-gold-primary" id="saveBtn">Save Member</button>
            <button type="button" class="btn-sm hidden" id="cancelEditBtn">Cancel Edit</button>
          </div>
        </form>
      </div>

      <div class="admin-card glass-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; flex-wrap:wrap; gap:0.5rem;">
          <h2 style="margin:0;">Current Roster (<span id="adminCount">0</span>)</h2>
        </div>
        <div id="adminMembersList"></div>
      </div>
    </div>
  </div>

  <script src="members.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let members = window.GoldenDaysStore.getMembers();

      const memberForm = document.getElementById("memberForm");
      const formTitle = document.getElementById("formTitle");
      const editMemberId = document.getElementById("editMemberId");
      const memberName = document.getElementById("memberName");
      const memberUsername = document.getElementById("memberUsername");
      const memberAvatarPath = document.getElementById("memberAvatarPath");
      const memberBio = document.getElementById("memberBio");
      const cancelEditBtn = document.getElementById("cancelEditBtn");
      const adminMembersList = document.getElementById("adminMembersList");
      const adminCount = document.getElementById("adminCount");
      const resetDefaultBtn = document.getElementById("resetDefaultBtn");

      function resetForm() {
        editMemberId.value = "";
        memberForm.reset();
        formTitle.textContent = "Add New Member";
        cancelEditBtn.classList.add("hidden");
      }

      cancelEditBtn.addEventListener("click", resetForm);

      function renderAdminList() {
        adminCount.textContent = members.length;
        adminMembersList.innerHTML = "";

        members.forEach((m, index) => {
          const cleanUser = window.GoldenDaysStore.sanitizeUsername(m.username);
          const row = document.createElement("div");
          row.className = "member-list-item";
          row.innerHTML = `
            <div class="member-item-left">
              <img src="${m.avatar || createFallbackDP(m.name)}" alt="${m.name}" />
              <div class="member-item-meta">
                <h4>#${index + 1} ${m.name}</h4>
                <span>@${cleanUser}</span>
              </div>
            </div>
            <div class="member-item-actions">
              <button class="order-btn" data-action="up" data-idx="${index}" ${index === 0 ? "disabled" : ""}>↑</button>
              <button class="order-btn" data-action="down" data-idx="${index}" ${index === members.length - 1 ? "disabled" : ""}>↓</button>
              <button class="btn-sm" data-action="edit" data-idx="${index}">Edit</button>
              <button class="btn-sm btn-danger" data-action="delete" data-idx="${index}">Delete</button>
            </div>
          `;

          const img = row.querySelector("img");
          img.onerror = () => { img.src = createFallbackDP(m.name); };
          adminMembersList.appendChild(row);
        });
      }

      adminMembersList.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const action = btn.dataset.action;
        const idx = Number(btn.dataset.idx);

        if (action === "up" && idx > 0) {
          [members[idx - 1], members[idx]] = [members[idx], members[idx - 1]];
          window.GoldenDaysStore.saveMembers(members);
          renderAdminList();
        } else if (action === "down" && idx < members.length - 1) {
          [members[idx], members[idx + 1]] = [members[idx + 1], members[idx]];
          window.GoldenDaysStore.saveMembers(members);
          renderAdminList();
        } else if (action === "edit") {
          const m = members[idx];
          editMemberId.value = m.id;
          memberName.value = m.name;
          memberUsername.value = window.GoldenDaysStore.sanitizeUsername(m.username);
          memberBio.value = m.bio;
          memberAvatarPath.value = m.avatar || "";
          formTitle.textContent = `Edit Member: ${m.name}`;
          cancelEditBtn.classList.remove("hidden");
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (action === "delete") {
          if (confirm(`Remove ${members[idx].name}?`)) {
            members.splice(idx, 1);
            window.GoldenDaysStore.saveMembers(members);
            renderAdminList();
          }
        }
      });

      memberForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const nameVal = memberName.value.trim();
        const userVal = window.GoldenDaysStore.sanitizeUsername(memberUsername.value);
        const bioVal = memberBio.value.trim();
        const nextNum = String(members.length + 1).padStart(2, "0");
        const avatarVal = memberAvatarPath.value.trim() || `member-${nextNum}.jpg`;

        if (editMemberId.value) {
          const targetIdx = members.findIndex(item => item.id === editMemberId.value);
          if (targetIdx !== -1) {
            members[targetIdx] = { ...members[targetIdx], name: nameVal, username: userVal, avatar: avatarVal, bio: bioVal };
          }
        } else {
          members.push({ id: "m-" + Date.now(), name: nameVal, username: userVal, avatar: avatarVal, bio: bioVal });
        }

        window.GoldenDaysStore.saveMembers(members);
        renderAdminList();
        resetForm();
      });

      resetDefaultBtn.addEventListener("click", () => {
        if (confirm("Reset to default 14 members (Aryan, Tanya & others)?")) {
          members = window.GoldenDaysStore.resetToDefaults();
          renderAdminList();
          resetForm();
          alert("Reset successful!");
        }
      });

      renderAdminList();
    });
  </script>
</body>
</html>
